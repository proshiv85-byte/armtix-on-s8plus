# FEX gives 32-bit x86 programs (Steam, games) very large memory reservations.
# Kernel 4.4's heuristic overcommit re-checks them against free memory on
# every fork, which fails (Steam: "Failed to start process ... OS Error 0").
# Fixed upstream in 5.2; always allow instead (the OOM killer still works).
vm.overcommit_memory = 1
