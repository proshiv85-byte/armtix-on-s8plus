# App launcher, minimal theme: text only
[main]
font=JetBrains Mono:size=10
prompt="search: "
icons-enabled=no
terminal=foot -e
layer=overlay
lines=12
width=30
line-height=26
horizontal-pad=14
vertical-pad=10
inner-pad=8
anchor=center

[colors]
background=111111f2
text=d6d2ccff
prompt=8a8580ff
placeholder=5c5c5cff
input=efebe6ff
match=c8ab84ff
selection=262626ff
selection-text=efebe6ff
selection-match=dcc19cff
border=3a3a3aff

[border]
width=1
radius=0
