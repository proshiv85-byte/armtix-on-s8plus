# Phone screen at boot: on or off.
#
# Applied by the armtix-screen service at boot (and by sway when it starts).
# Change it at runtime with `armtix-screen on|off` (add --save to keep it).
#
# From TWRP (no Linux running) this file is /data/etc/armtix/screen.conf:
#   TWRP -> Advanced -> Terminal:
#     echo SCREEN=off > /data/etc/armtix/screen.conf
SCREEN=on
