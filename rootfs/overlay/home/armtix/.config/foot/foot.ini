# sway is scaled x3: font sizes are in points
font=JetBrains Mono:size=8, Symbols Nerd Font:size=8
pad=8x6

[scrollback]
lines=5000

[cursor]
style=block
blink=no

# minimal theme: warm grays, sand and slate (see ~/.config/sway/theme)
[colors-dark]
background=111111
foreground=d6d2cc
selection-background=3a3a3a
selection-foreground=efebe6
regular0=262626
regular1=c27c6e
regular2=a8a77e
regular3=c8ab84
regular4=7d8b96
regular5=a8958f
regular6=8d9aa4
regular7=b2a89e
bright0=5c5c5c
bright1=d6948a
bright2=bdbc96
bright3=dcc19c
bright4=97a5b0
bright5=bfaca6
bright6=a7b3bc
bright7=efebe6
