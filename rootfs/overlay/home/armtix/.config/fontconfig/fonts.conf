<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- UI: Roboto, terminal: JetBrains Mono, icons: Symbols Nerd Font -->
<fontconfig>
  <alias><family>sans-serif</family>
    <prefer><family>Roboto</family><family>DejaVu Sans</family><family>Symbols Nerd Font</family></prefer></alias>
  <alias><family>sans</family>
    <prefer><family>Roboto</family><family>DejaVu Sans</family><family>Symbols Nerd Font</family></prefer></alias>
  <alias><family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>DejaVu Sans Mono</family><family>Symbols Nerd Font</family></prefer></alias>
</fontconfig>
