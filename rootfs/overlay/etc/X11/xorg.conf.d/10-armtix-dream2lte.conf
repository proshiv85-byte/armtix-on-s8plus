# ARMtix on Galaxy S8+ (dream2lte): plain framebuffer, no GPU, no working udev.
#
# - Samsung decon exposes only fbdev (/dev/fb0, 1440x2960 XRGB8888); no DRM.
# - udev 261 does not run on the 4.4 kernel, so udev hotplug is off and input
#   devices are declared by path with the evdev driver (libinput needs libudev,
#   which fails the same way).

Section "ServerFlags"
	Option "AutoAddDevices" "false"
	Option "AutoEnableDevices" "false"
	Option "BlankTime"   "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime"     "0"
EndSection

Section "Device"
	Identifier "decon"
	Driver     "fbdev"
	Option     "fbdev"    "/dev/fb0"
	Option     "ShadowFB" "on"
	# managed by armtix-set-rotation (fbdev can only rotate at X start)
	#Option    "Rotate" "none"
EndSection

Section "Monitor"
	Identifier "panel"
	# 6.2" 1440x2960 (~529 ppi); physical size lets X compute DPI
	DisplaySize 68 140
EndSection

Section "Screen"
	Identifier "screen"
	Device     "decon"
	Monitor    "panel"
	DefaultDepth 24
EndSection

Section "InputDevice"
	Identifier "touchscreen"
	Driver     "evdev"
	Option     "Device" "/dev/input/event0"
	# managed by armtix-set-rotation
	#Option    "TransformationMatrix" "1 0 0 0 1 0 0 0 1"
EndSection

Section "InputDevice"
	Identifier "keys"
	Driver     "evdev"
	# gpio_keys: power / volume / bixby
	Option     "Device" "/dev/input/event6"
EndSection

# USB keyboard/mouse (OTG): armtix-inputd forwards hot-plugged devices into
# these two permanent uinput devices (Xorg can't hot-add without udev)
Section "InputDevice"
	Identifier "usb-keyboard"
	Driver     "evdev"
	Option     "Device" "/dev/input/armtix-kbd"
EndSection

Section "InputDevice"
	Identifier "usb-mouse"
	Driver     "evdev"
	Option     "Device" "/dev/input/armtix-mouse"
EndSection

Section "ServerLayout"
	Identifier  "layout"
	Screen      "screen"
	InputDevice "touchscreen" "CorePointer"
	InputDevice "keys"        "CoreKeyboard"
	InputDevice "usb-keyboard" "SendCoreEvents"
	InputDevice "usb-mouse"    "SendCoreEvents"
EndSection
