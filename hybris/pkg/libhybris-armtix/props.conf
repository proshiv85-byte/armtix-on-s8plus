# Android properties for libhybris on ARMtix (there is no Android init, so no
# property service). The first definition of a key wins; these are read before
# /vendor/build.prop and /system/build.prop.
#
# gralloc/hwcomposer HAL modules: gralloc.exynos5.so
ro.board.platform=exynos5
ro.hardware=samsungexynos8895
# EGL driver: /vendor/lib64/egl/libGLES_mali.so
ro.hardware.egl=mali
